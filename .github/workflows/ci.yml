name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: sh -n scripts/fetch-binary.sh
      - name: Test wrapped URLs against herdr 0.9.3
        if: runner.os == 'Linux'
        run: |
          curl --retry 3 -fsSL https://github.com/herdrdev/herdr/releases/download/v0.9.3/herdr-linux-x86_64 -o "$RUNNER_TEMP/herdr"
          chmod +x "$RUNNER_TEMP/herdr"
          HERDR_TEST_BIN="$RUNNER_TEMP/herdr" go test -v -run TestLive ./...
