id = "urlview"
name = "urlview"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Pick and open URLs from the focused pane. A herdr port of tmux-urlview."
platforms = ["linux", "macos"]

# Opens as a popup so the fzf picker is interactive without disturbing the tab
# layout. The script resolves the invoking pane from HERDR_PANE_ID, falling back
# to whichever pane the server reports as focused.
[[panes]]
id = "pick"
title = "URLs"
placement = "popup"
width = "80%"
height = "60%"
command = ["bin/herdr-urlview"]
